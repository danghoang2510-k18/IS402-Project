[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-rf-credit"
version = "0.1.0"
description = "Federated Random Forest aggregation for credit risk"
requires-python = ">=3.11,<4.0"
dependencies = ["flwr==1.42.0", "numpy>=1.26,<3", "pandas>=2,<3", "scikit-learn>=1.3,<2", "requests>=2.33,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.hatch.build.targets.wheel]
packages = ["fl_app"]

[tool.flwr.app]
publisher = "project-cloud"
fab-include = ["fl_app/**/*.py"]

[tool.flwr.app.components]
serverapp = "fl_app.server_app:app"
clientapp = "fl_app.client_app:app"

[tool.flwr.app.config]
mode = "iid"
num-clients = 5
trees-per-client = 20
seed = 42
alpha = 0.5
